<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ניהול מועדון · לפריקון</title>
<meta name="theme-color" content="#145530">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/css/app.css">
<style>
  .tabs { display: flex; gap: 8px; margin: 18px 0; flex-wrap: wrap; }
  .tab {
    padding: 9px 16px; border-radius: 11px; border: 1.5px solid var(--line); background: #fff;
    font-weight: 600; font-size: .9rem; cursor: pointer; transition: all .15s;
  }
  .tab.active { background: var(--green); color: #fff; border-color: var(--green); }
  .panel { display: none; }
  .panel.active { display: block; }

  /* גובה אוטומטי לפי היחס — כדי שהטקסט בגרף לא יימתח */
  .chart { width: 100%; height: auto; aspect-ratio: 700 / 180; display: block; }
  .chart .bar { fill: var(--green); }
  .chart .bar.reward { fill: var(--gold); }
  .chart .grid { stroke: var(--line); stroke-width: 1; }
  .chart text { font-size: 9px; fill: var(--muted); }

  .drawer {
    position: fixed; inset: 0; background: rgba(13, 58, 32, .45);
    display: none; z-index: 80; padding: 16px; overflow-y: auto;
  }
  .drawer.open { display: block; }
  .drawer-inner {
    max-width: 560px; margin: 24px auto; background: #fff;
    border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow-lg);
  }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: .9rem; margin: 14px 0; }
  .kv dt { color: var(--muted); font-weight: 600; }
  .kv dd { font-weight: 600; }
  .clickable { cursor: pointer; }
  .section-title { font-size: 1.05rem; font-weight: 800; margin: 22px 0 10px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="title">☘️ ניהול המועדון</div>
  <div class="row" style="gap:8px">
    <a class="navlink" href="/staff/scan">סורק</a>
    <span class="who" id="who"></span>
    <button class="btn ghost sm" id="logoutBtn" style="background:rgba(255,255,255,.13);border:0;color:#fff">יציאה</button>
  </div>
</div>

<main class="wrap wide">

  <div class="tabs">
    <button class="tab active" data-panel="dash">סקירה</button>
    <button class="tab" data-panel="customers">לקוחות</button>
    <button class="tab" data-panel="team">צוות</button>
    <button class="tab" data-panel="system">מערכת</button>
  </div>

  <!-- ===== סקירה ===== -->
  <section class="panel active" id="panel-dash">
    <div class="metrics" id="metrics"></div>

    <h3 class="section-title">30 הימים האחרונים</h3>
    <div class="card flat">
      <svg class="chart" id="chart" viewBox="0 0 700 180" role="img"
           aria-label="ניקובים ומימושים לפי יום"></svg>
      <div class="row" style="gap:16px;margin-top:10px;font-size:.82rem">
        <span class="row" style="gap:6px"><span style="width:12px;height:12px;border-radius:3px;background:var(--green);display:inline-block"></span> ניקובים</span>
        <span class="row" style="gap:6px"><span style="width:12px;height:12px;border-radius:3px;background:var(--gold);display:inline-block"></span> קפה חינם</span>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-top:22px">
      <div>
        <h3 class="section-title" style="margin-top:0">הלקוחות המובילים</h3>
        <div class="table-wrap">
          <table><thead><tr><th>שם</th><th>ניקובים</th><th>סה״כ קפה</th><th>חינם</th></tr></thead>
          <tbody id="topBody"></tbody></table>
        </div>
      </div>
      <div>
        <h3 class="section-title" style="margin-top:0">פעילות אחרונה</h3>
        <div class="table-wrap" style="max-height:340px;overflow-y:auto">
          <table><thead><tr><th>מתי</th><th>לקוח</th><th>פעולה</th><th>צוות</th></tr></thead>
          <tbody id="recentBody"></tbody></table>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== לקוחות ===== -->
  <section class="panel" id="panel-customers">
    <div class="row wrap-row between" style="margin-bottom:14px;gap:10px">
      <input class="input grow" id="custSearch" type="search" placeholder="חיפוש לפי שם, טלפון, אימייל או מספר כרטיסייה"
             style="max-width:420px" autocomplete="off">
      <a class="btn ghost sm" href="/admin/api/export.csv">ייצוא ל‑CSV ⬇</a>
    </div>

    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>שם</th><th>טלפון</th><th>ניקובים</th><th>סה״כ קפה</th><th>חינם</th><th>סריקה אחרונה</th><th>סטטוס</th>
        </tr></thead>
        <tbody id="custBody"></tbody>
      </table>
    </div>
    <div class="row between" style="margin-top:12px">
      <button class="btn ghost sm" id="prevPage">הקודם</button>
      <span class="small muted" id="pageInfo"></span>
      <button class="btn ghost sm" id="nextPage">הבא</button>
    </div>
  </section>

  <!-- ===== צוות ===== -->
  <section class="panel" id="panel-team">
    <div class="table-wrap" style="margin-bottom:22px">
      <table>
        <thead><tr><th>שם משתמש</th><th>שם תצוגה</th><th>תפקיד</th><th>סטטוס</th><th></th></tr></thead>
        <tbody id="staffBody"></tbody>
      </table>
    </div>

    <div class="card" style="max-width:460px">
      <h2>הוספת איש/אשת צוות</h2>
      <p class="lead">כל ברמן/ית מקבל/ת משתמש משלו — כך רואים מי ניקב מה.</p>
      <form id="staffForm">
        <div class="field">
          <label for="sUser">שם משתמש (אנגלית)</label>
          <input class="input ltr" id="sUser" required pattern="[a-z0-9._-]{3,32}" placeholder="dana">
        </div>
        <div class="field">
          <label for="sName">שם תצוגה</label>
          <input class="input" id="sName" placeholder="דנה">
        </div>
        <div class="field">
          <label for="sPass">סיסמה (8 תווים ומעלה)</label>
          <input class="input ltr" id="sPass" type="text" required minlength="8">
        </div>
        <div class="field">
          <label for="sRole">תפקיד</label>
          <select class="input" id="sRole">
            <option value="staff">ברמן/ית — סריקה בלבד</option>
            <option value="admin">מנהל/ת — גישה מלאה</option>
          </select>
        </div>
        <div id="staffError" class="alert err hidden" style="margin-bottom:12px"></div>
        <button class="btn" type="submit">הוספה</button>
      </form>
    </div>
  </section>

  <!-- ===== מערכת ===== -->
  <section class="panel" id="panel-system">
    <div id="health" class="stack"></div>
  </section>

</main>

<!-- ===== חלון לקוח ===== -->
<div class="drawer" id="drawer">
  <div class="drawer-inner" id="drawerInner"></div>
</div>

<script type="module">
import { $, $$, api, toast, escapeHtml, formatDate, formatDateTime } from '/js/common.js';

let GOAL = 8;
let page = 0;
const PAGE_SIZE = 50;
let searchTerm = '';

/* ===== לשוניות ===== */
$$('.tab').forEach((tab) => {
  tab.addEventListener('click', () => {
    $$('.tab').forEach((t) => t.classList.remove('active'));
    $$('.panel').forEach((p) => p.classList.remove('active'));
    tab.classList.add('active');
    $(`#panel-${tab.dataset.panel}`).classList.add('active');

    if (tab.dataset.panel === 'customers') loadCustomers();
    if (tab.dataset.panel === 'team') loadStaff();
    if (tab.dataset.panel === 'system') loadHealth();
  });
});

/* ===== סקירה ===== */
const METRICS = [
  ['totalCustomers', 'חברי מועדון'],
  ['punchesToday', 'ניקובים היום'],
  ['punchesWeek', 'ניקובים השבוע'],
  ['rewardsMonth', 'קפה חינם החודש'],
  ['readyForReward', 'מחכים לקפה חינם'],
  ['newCustomersWeek', 'נרשמו השבוע'],
  ['totalPunches', 'סה״כ ניקובים'],
  ['appleRegistrations', 'מכשירי Apple רשומים'],
];

async function loadDash() {
  const data = await api('/admin/api/stats');
  GOAL = data.goal;

  $('#metrics').innerHTML = METRICS
    .map(([key, label]) => `<div class="metric"><div class="v">${data.overview[key] ?? 0}</div><div class="k">${label}</div></div>`)
    .join('');

  drawChart(data.daily);

  $('#topBody').innerHTML = data.top.length
    ? data.top
        .map(
          (c) => `<tr class="clickable" data-id="${escapeHtml(c.public_id)}">
            <td>${escapeHtml(c.name || 'ללא שם')}</td>
            <td><span class="chip ${c.punches >= GOAL ? 'gold' : ''}">${Math.min(GOAL, c.punches)}/${GOAL}</span></td>
            <td>${c.total_punches}</td><td>${c.total_rewards}</td></tr>`
        )
        .join('')
    : '<tr><td colspan="4" class="muted center">אין נתונים עדיין</td></tr>';

  const labels = { punch: '☕ ניקוב', reward: '🍀 קפה חינם', adjust: '✏️ תיקון', join: '✨ הצטרפות', block: '⛔ חסימה', unblock: '✅ שחרור' };
  $('#recentBody').innerHTML = data.recent.length
    ? data.recent
        .map(
          (e) => `<tr class="clickable" data-id="${escapeHtml(e.public_id)}">
            <td class="tiny muted">${formatDateTime(e.created_at)}</td>
            <td>${escapeHtml(e.customer_name || '—')}</td>
            <td>${labels[e.type] || e.type}</td>
            <td class="tiny muted">${escapeHtml(e.staff_name || '—')}</td></tr>`
        )
        .join('')
    : '<tr><td colspan="4" class="muted center">אין פעילות עדיין</td></tr>';
}

function drawChart(daily) {
  const svg = $('#chart');
  if (!daily.length) {
    svg.innerHTML = '<text x="350" y="90" text-anchor="middle">אין נתונים עדיין</text>';
    return;
  }

  // PAD_S שומר רצועה בצד לתוויות הציר, כדי שלא יתנגשו בעמודה הראשונה.
  const W = 700, H = 180, PAD_B = 22, PAD_T = 10, PAD_S = 30;
  const plotW = W - PAD_S;
  const max = Math.max(4, ...daily.map((d) => d.punches + d.rewards));
  const slot = plotW / daily.length;
  const barW = Math.max(3, Math.min(18, slot * 0.62));
  const scale = (v) => ((H - PAD_B - PAD_T) * v) / max;

  let out = '';
  for (let i = 0; i <= 3; i++) {
    const y = PAD_T + ((H - PAD_B - PAD_T) * i) / 3;
    out += `<line class="grid" x1="${PAD_S}" y1="${y}" x2="${W}" y2="${y}"/>`;
    out += `<text x="${PAD_S - 5}" y="${y + 3}" text-anchor="end">${Math.round((max * (3 - i)) / 3)}</text>`;
  }

  daily.forEach((d, i) => {
    const x = PAD_S + slot * i + (slot - barW) / 2;
    const hP = scale(d.punches);
    const hR = scale(d.rewards);
    if (hP > 0) out += `<rect class="bar" x="${x}" y="${H - PAD_B - hP}" width="${barW}" height="${hP}" rx="2"><title>${d.day}: ${d.punches} ניקובים</title></rect>`;
    if (hR > 0) out += `<rect class="bar reward" x="${x}" y="${H - PAD_B - hP - hR}" width="${barW}" height="${hR}" rx="2"><title>${d.day}: ${d.rewards} קפה חינם</title></rect>`;
    if (i % Math.ceil(daily.length / 8) === 0) {
      out += `<text x="${x + barW / 2}" y="${H - 6}" text-anchor="middle">${d.day.slice(8)}/${d.day.slice(5, 7)}</text>`;
    }
  });

  svg.innerHTML = out;
}

/* ===== לקוחות ===== */
async function loadCustomers() {
  const params = new URLSearchParams({ limit: PAGE_SIZE, offset: page * PAGE_SIZE });
  if (searchTerm) params.set('q', searchTerm);
  const data = await api(`/admin/api/customers?${params}`);

  $('#custBody').innerHTML = data.customers.length
    ? data.customers
        .map(
          (c) => `<tr class="clickable" data-id="${escapeHtml(c.publicId)}">
            <td>${escapeHtml(c.name || 'ללא שם')}</td>
            <td class="mono">${escapeHtml(c.phone || '—')}</td>
            <td><span class="chip ${c.rewardReady ? 'gold' : ''}">${c.punches}/${c.goal}</span></td>
            <td>${c.totalPunches}</td>
            <td>${c.totalRewards}</td>
            <td class="tiny muted">${formatDateTime(c.lastScanAt)}</td>
            <td>${c.blocked ? '<span class="chip danger">חסום</span>' : '<span class="chip">פעיל</span>'}</td>
          </tr>`
        )
        .join('')
    : '<tr><td colspan="7" class="muted center">לא נמצאו לקוחות</td></tr>';

  const from = data.customers.length ? page * PAGE_SIZE + 1 : 0;
  $('#pageInfo').textContent = `${from}–${page * PAGE_SIZE + data.customers.length} מתוך ${data.total}`;
  $('#prevPage').disabled = page === 0;
  $('#nextPage').disabled = data.customers.length < PAGE_SIZE;
}

let searchTimer = null;
$('#custSearch').addEventListener('input', (e) => {
  clearTimeout(searchTimer);
  searchTerm = e.target.value.trim();
  page = 0;
  searchTimer = setTimeout(() => loadCustomers().catch((err) => toast(err.message, 'err')), 280);
});
$('#prevPage').addEventListener('click', () => { if (page > 0) { page--; loadCustomers(); } });
$('#nextPage').addEventListener('click', () => { page++; loadCustomers(); });

/* ===== חלון לקוח ===== */
document.body.addEventListener('click', (e) => {
  const row = e.target.closest('tr.clickable');
  if (row?.dataset.id) openCustomer(row.dataset.id);
});

// הלקוח שפתוח כרגע בחלון. המאזינים נרשמים פעם אחת בלבד (ראו מטה) —
// רישום מחדש בכל פתיחה היה גורם לכל לחיצה לרוץ פעמיים ויותר.
let openCustomerId = null;
let openCustomerBlocked = false;

async function openCustomer(publicId) {
  const c = await api(`/admin/api/customers/${publicId}`);
  openCustomerId = publicId;
  openCustomerBlocked = c.blocked;
  const labels = { punch: '☕ ניקוב', reward: '🍀 קפה חינם', adjust: '✏️ תיקון', join: '✨ הצטרפות', block: '⛔ חסימה', unblock: '✅ שחרור' };

  $('#drawerInner').innerHTML = `
    <div class="row between" style="margin-bottom:6px">
      <h2 style="font-size:1.3rem;font-weight:900">${escapeHtml(c.name || 'ללא שם')}</h2>
      <button class="btn ghost sm" id="closeDrawer">סגירה ✕</button>
    </div>
    <div class="row" style="gap:8px;margin-bottom:14px">
      <span class="chip ${c.rewardReady ? 'gold' : ''}">${c.punches}/${c.goal} ניקובים</span>
      ${c.blocked ? '<span class="chip danger">חסום</span>' : ''}
    </div>

    <dl class="kv">
      <dt>טלפון</dt><dd class="mono">${escapeHtml(c.phone || '—')}</dd>
      <dt>אימייל</dt><dd class="mono">${escapeHtml(c.email || '—')}</dd>
      <dt>מספר כרטיסייה</dt><dd class="mono">${escapeHtml(c.publicId)}</dd>
      <dt>הצטרף/ה</dt><dd>${formatDate(c.createdAt)}</dd>
      <dt>סה״כ קפה</dt><dd>${c.totalPunches}</dd>
      <dt>סה״כ סריקות</dt><dd>${c.totalScans}</dd>
      <dt>קפה חינם שמומש</dt><dd>${c.totalRewards}</dd>
      <dt>סריקה אחרונה</dt><dd>${formatDateTime(c.lastScanAt)}</dd>
    </dl>

    <div class="row" style="gap:8px;flex-wrap:wrap;margin-bottom:14px">
      <button class="btn ghost sm" data-act="adjust" data-delta="1">+1 ניקוב</button>
      <button class="btn ghost sm" data-act="adjust" data-delta="-1">−1 ניקוב</button>
      <button class="btn ghost sm" data-act="resync">סנכרון ארנקים ↻</button>
      <a class="btn ghost sm" href="${escapeHtml(c.cardUrl)}" target="_blank" rel="noopener">פתיחת הכרטיסייה ↗</a>
      <button class="btn ${c.blocked ? 'ghost' : 'danger'} sm" data-act="block">${c.blocked ? 'ביטול חסימה' : 'חסימה'}</button>
    </div>

    <h3 class="section-title" style="margin-top:8px">עריכת פרטים</h3>
    <form id="editForm">
      <div class="field"><label>שם</label><input class="input" name="name" value="${escapeHtml(c.name || '')}" maxlength="60"></div>
      <div class="field"><label>טלפון</label><input class="input ltr" name="phone" value="${escapeHtml(c.phone || '')}" maxlength="20"></div>
      <div class="field"><label>אימייל</label><input class="input ltr" name="email" value="${escapeHtml(c.email || '')}" maxlength="120"></div>
      <div class="field"><label>הערה פנימית</label><textarea class="input" name="notes" rows="2" maxlength="500">${escapeHtml(c.notes || '')}</textarea></div>
      <button class="btn sm auto" type="submit">שמירה</button>
    </form>

    <h3 class="section-title">היסטוריה</h3>
    <div class="stack" style="gap:5px;max-height:260px;overflow-y:auto;font-size:.88rem">
      ${c.history.length
        ? c.history.map((e) => `<div class="row between" style="border-bottom:1px solid var(--line);padding-bottom:5px">
            <span>${labels[e.type] || e.type}${e.delta ? ` <span class="muted">(${e.delta > 0 ? '+' : ''}${e.delta})</span>` : ''}
            ${e.staff_name ? `<span class="tiny muted"> · ${escapeHtml(e.staff_name)}</span>` : ''}</span>
            <span class="tiny muted">${formatDateTime(e.created_at)}</span></div>`).join('')
        : '<span class="muted">אין פעילות</span>'}
    </div>
  `;

  $('#drawer').classList.add('open');
}

$('#drawerInner').addEventListener('click', async (e) => {
  if (e.target.closest('#closeDrawer')) return closeDrawer();

  const btn = e.target.closest('[data-act]');
  if (!btn || !openCustomerId) return;
  const publicId = openCustomerId;

  btn.disabled = true;
  try {
    if (btn.dataset.act === 'adjust') {
      await api(`/admin/api/customers/${publicId}/adjust`, { method: 'POST', body: { delta: Number(btn.dataset.delta) } });
      toast('עודכן ✓');
    } else if (btn.dataset.act === 'block') {
      await api(`/admin/api/customers/${publicId}/block`, { method: 'POST', body: { blocked: !openCustomerBlocked } });
      toast(openCustomerBlocked ? 'החסימה בוטלה' : 'הכרטיסייה נחסמה');
    } else if (btn.dataset.act === 'resync') {
      await api(`/admin/api/customers/${publicId}/resync`, { method: 'POST', body: {} });
      toast('נשלח עדכון לארנקים ✓');
      btn.disabled = false;
      return;
    }
    await openCustomer(publicId);
    loadCustomers().catch(() => {});
    loadDash().catch(() => {});
  } catch (err) {
    toast(err.message, 'err');
    btn.disabled = false;
  }
});

$('#drawerInner').addEventListener('submit', async (e) => {
  if (e.target.id !== 'editForm' || !openCustomerId) return;
  e.preventDefault();

  const publicId = openCustomerId;
  const fd = new FormData(e.target);
  try {
    await api(`/admin/api/customers/${publicId}/profile`, {
      method: 'POST',
      body: { name: fd.get('name'), phone: fd.get('phone'), email: fd.get('email'), notes: fd.get('notes') },
    });
    toast('הפרטים נשמרו ✓');
    await openCustomer(publicId);
    loadCustomers().catch(() => {});
  } catch (err) {
    toast(err.message, 'err');
  }
});

function closeDrawer() {
  $('#drawer').classList.remove('open');
  openCustomerId = null;
}
$('#drawer').addEventListener('click', (e) => { if (e.target.id === 'drawer') closeDrawer(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });

/* ===== צוות ===== */
async function loadStaff() {
  const { staff } = await api('/admin/api/staff');
  $('#staffBody').innerHTML = staff
    .map(
      (s) => `<tr>
        <td class="mono">${escapeHtml(s.username)}</td>
        <td>${escapeHtml(s.display_name || '')}</td>
        <td>${s.role === 'admin' ? '<span class="chip gold">מנהל/ת</span>' : '<span class="chip">ברמן/ית</span>'}</td>
        <td>${s.active ? '<span class="chip">פעיל</span>' : '<span class="chip muted">מושבת</span>'}</td>
        <td class="row" style="gap:6px">
          <button class="btn ghost sm" data-staff="${s.id}" data-act="pass">סיסמה חדשה</button>
          <button class="btn ghost sm" data-staff="${s.id}" data-act="toggle" data-active="${s.active ? 0 : 1}">
            ${s.active ? 'השבתה' : 'הפעלה'}</button>
        </td></tr>`
    )
    .join('');
}

$('#staffBody').addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-staff]');
  if (!btn) return;
  const id = btn.dataset.staff;
  try {
    if (btn.dataset.act === 'pass') {
      const password = prompt('סיסמה חדשה (8 תווים לפחות):');
      if (!password) return;
      await api(`/admin/api/staff/${id}/password`, { method: 'POST', body: { password } });
      toast('הסיסמה עודכנה ✓');
    } else {
      await api(`/admin/api/staff/${id}/active`, { method: 'POST', body: { active: btn.dataset.active === '1' } });
      toast('עודכן ✓');
      loadStaff();
    }
  } catch (err) {
    toast(err.message, 'err');
  }
});

$('#staffForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = $('#staffError');
  errorEl.classList.add('hidden');
  try {
    await api('/admin/api/staff', {
      method: 'POST',
      body: {
        username: $('#sUser').value.trim(),
        displayName: $('#sName').value.trim(),
        password: $('#sPass').value,
        role: $('#sRole').value,
      },
    });
    toast('נוסף ✓');
    e.target.reset();
    loadStaff();
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.classList.remove('hidden');
  }
});

/* ===== מערכת ===== */
async function loadHealth() {
  const h = await api('/admin/api/health');
  const yes = '<span class="chip">מוגדר ✓</span>';
  const no = '<span class="chip danger">לא מוגדר</span>';

  $('#health').innerHTML = `
    <div class="card flat">
      <h2>כתובת המערכת</h2>
      <dl class="kv">
        <dt>BASE_URL</dt><dd class="mono">${escapeHtml(h.baseUrl)}</dd>
        <dt>HTTPS</dt><dd>${h.https ? yes : '<span class="chip danger">לא — חובה לעדכוני ארנק</span>'}</dd>
        <dt>מסד נתונים</dt><dd class="mono">${escapeHtml(h.driver)}</dd>
        <dt>חוק המועדון</dt><dd>${h.goal} קפה — ה־${h.goal + 1} חינם</dd>
      </dl>
    </div>

    <div class="card flat">
      <h2>Apple Wallet</h2>
      <dl class="kv">
        <dt>סטטוס</dt><dd>${h.apple.configured ? yes : no}</dd>
        <dt>Pass Type ID</dt><dd class="mono">${escapeHtml(h.apple.passTypeId || '—')}</dd>
        ${h.apple.certificate ? `
          <dt>Team ID</dt><dd class="mono">${escapeHtml(h.apple.certificate.teamId)}</dd>
          <dt>תוקף התעודה</dt><dd>${formatDate(h.apple.certificate.expiresAt)} (${h.apple.certificate.daysLeft} ימים)</dd>` : ''}
      </dl>
      ${h.apple.warnings.length ? h.apple.warnings.map((w) => `<div class="alert warn" style="margin-top:8px">⚠️ ${escapeHtml(w)}</div>`).join('') : ''}
    </div>

    <div class="card flat">
      <h2>Google Wallet</h2>
      <dl class="kv">
        <dt>סטטוס</dt><dd>${h.google.configured ? yes : no}</dd>
        <dt>Issuer ID</dt><dd class="mono">${escapeHtml(h.google.issuerId || '—')}</dd>
        <dt>Class ID</dt><dd class="mono">${escapeHtml(h.google.classId || '—')}</dd>
      </dl>
    </div>

    <div class="card flat">
      <h2>גיבוי</h2>
      <p class="lead">מוריד עותק מלא של מסד הנתונים — כל הלקוחות, הניקובים וההיסטוריה.
         שווה לעשות את זה פעם בשבוע ולשמור אצלכם.</p>
      <a class="btn sm auto" href="/admin/api/backup.db">הורדת גיבוי ⬇</a>
    </div>

    <div class="card flat">
      <h2>קישורים לשיתוף</h2>
      <p class="lead">הדביקו את הקישור הזה ב‑QR על השולחנות, בסטורי ובאתר:</p>
      <div class="row" style="gap:8px">
        <input class="input mono grow" id="joinUrl" readonly value="${escapeHtml(h.baseUrl)}/join">
        <button class="btn sm auto" id="copyJoin">העתקה</button>
      </div>
    </div>
  `;

  $('#copyJoin').addEventListener('click', async () => {
    await navigator.clipboard.writeText($('#joinUrl').value);
    toast('הועתק ✓');
  });
}

/* ===== אתחול ===== */
$('#logoutBtn').addEventListener('click', async () => {
  await api('/staff/logout', { method: 'POST' }).catch(() => {});
  location.href = '/staff/login';
});

(async () => {
  try {
    const me = await api('/staff/api/me');
    $('#who').textContent = me.staff.name;
    await loadDash();
  } catch (err) {
    if (err.status === 401 || err.status === 403) location.href = '/staff/login';
    else toast(err.message, 'err');
  }
})();
</script>
